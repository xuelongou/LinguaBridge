<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语桥 LinguaBridge · MVP 演示</title>
<style>
  :root{
    --bg:#f4f7f6; --card:#ffffff; --ink:#1f2d2b; --sub:#5b6b68; --line:#dbe5e2;
    --teal:#0f766e; --teal-soft:#e6f2f0; --accent:#c2410c; --warn:#fff7ed; --warn-line:#fdba74;
    --radius:14px; --shadow:0 2px 10px rgba(15,60,55,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:var(--teal);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{font-size:20px;letter-spacing:1px}
  header h1 span{font-size:13px;opacity:.85;font-weight:400;margin-left:8px}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav a{color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:14px;opacity:.85}
  nav a.active,nav a:hover{background:rgba(255,255,255,.18);opacity:1}
  main{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
  .card h2{font-size:17px;margin-bottom:12px;color:var(--teal)}
  .muted{color:var(--sub);font-size:13px;line-height:1.7}
  .grid{display:grid;gap:16px}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:820px){.grid-3{grid-template-columns:1fr}}
  .mod{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff}
  .mod h3{font-size:15px;margin-bottom:8px}
  .mod .tag{display:inline-block;font-size:12px;color:var(--teal);background:var(--teal-soft);border-radius:6px;padding:2px 8px;margin-bottom:8px}
  .warn{background:var(--warn);border:1px solid var(--warn-line);border-radius:12px;padding:14px 16px;font-size:13px;color:#7c2d12;line-height:1.8}
  button,.btn{font-family:inherit;font-size:14px;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:9px;padding:9px 16px;cursor:pointer}
  button.ghost{background:#fff;color:var(--teal)}
  button:disabled{opacity:.45;cursor:not-allowed}
  select,input[type=text],textarea{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  textarea{width:100%;resize:vertical;min-height:56px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .swap{font-size:18px;background:#fff;color:var(--teal);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}
  .bank{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  @media(max-width:700px){.bank{grid-template-columns:1fr}}
  .bank-item{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:.15s}
  .bank-item:hover,.bank-item.active{border-color:var(--teal);background:var(--teal-soft)}
  .bank-item .zh{font-weight:600;font-size:14px}
  .bank-item .sc{color:var(--sub);font-size:12px;margin-top:3px}
  .result{margin-top:16px;border:1px dashed var(--teal);border-radius:12px;padding:16px;background:#fbfdfd}
  .result .lang-label{font-size:12px;color:var(--sub)}
  .result .big{font-size:22px;font-weight:600;margin:6px 0}
  .badge{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;margin-left:8px}
  .badge.offline{background:var(--teal-soft);color:var(--teal)}
  .badge.online{background:#e0f2fe;color:#0369a1}
  .badge.fallback{background:var(--warn);color:var(--accent)}
  .pairs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
  @media(max-width:700px){.pairs{grid-template-columns:1fr}}
  .pair{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .pair .k{font-size:12px;color:var(--sub)}
  .pair .v{font-size:15px;margin-top:3px}
  .sign-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.sign-layout{grid-template-columns:1fr}}
  .cam-box{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  video,canvas,.cam-img{width:100%;max-height:260px;border-radius:10px;background:#0f1716;object-fit:contain}
  .sign-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  .sign-card{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
  .sign-card.active{border-color:var(--teal);background:var(--teal-soft)}
  .sign-card svg{flex:none}
  .sign-card .no{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:var(--teal-soft);color:var(--teal);font-size:12px;margin-right:6px}
  .gesture{font-size:13px;color:var(--sub);line-height:1.8;margin-top:8px}
  .sign-detail{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .sd-block{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfdfd}
  .sd-block b{color:var(--teal);font-size:13px}
  .sd-block ol{margin:6px 0 0 18px;font-size:13px;line-height:1.8}
  .sd-block p{margin-top:6px;font-size:13px;line-height:1.7;color:var(--sub)}
  @media(max-width:700px){.sign-detail{grid-template-columns:1fr}}
  .big-sign{display:flex;gap:16px;align-items:center;margin-top:10px}
  .big-sign svg{flex:none}
  .kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:12px;color:var(--sub)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid var(--line);padding:9px 10px;text-align:left}
  th{background:var(--teal-soft);color:var(--teal)}
  .step{display:flex;gap:12px;margin-bottom:14px}
  .step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;text-align:center;line-height:26px;font-size:13px}
  .arch{display:grid;gap:8px;font-size:13px}
  .arch .layer{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fbfdfd}
  .arch .layer b{color:var(--teal)}
  footer{max-width:1080px;margin:0 auto;padding:0 20px 30px;color:var(--sub);font-size:12px}
  .note{font-size:12px;color:var(--sub);margin-top:8px}
  .loading{color:var(--teal);font-size:13px}
  /* 对话记录气泡 */
  .convo{margin-top:18px}
  .convo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .convo-round{display:flex;gap:10px;margin-bottom:12px;align-items:stretch}
  .bubble{flex:1;max-width:48%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
  .bubble.src{background:#f7faf9}
  .bubble.tgt{background:var(--teal-soft);border-color:#bcd9d5}
  .bubble .bl{font-size:11px;color:var(--sub);margin-bottom:3px}
  .bubble .bt{font-size:15px;line-height:1.6;word-break:break-word}
  .bubble .mini{margin-top:6px;font-size:12px;border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:7px;padding:3px 9px;cursor:pointer}
  /* 大字对照卡片（投屏） */
  .bigcard{position:fixed;inset:0;background:rgba(15,45,43,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .bigcard.hidden{display:none}
  .bigcard-inner{background:#fff;border-radius:18px;max-width:880px;width:100%;padding:30px;position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center}
  .bc-side .bc-label{font-size:13px;color:var(--sub);margin-bottom:10px}
  .bc-side .bc-text{font-size:28px;font-weight:600;line-height:1.5;word-break:break-word}
  .bc-side.tgt .bc-text{color:var(--teal)}
  .bc-arrow{font-size:26px;color:var(--teal)}
  .bigcard-close{position:absolute;top:14px;right:14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
  @media(max-width:700px){.bigcard-inner{grid-template-columns:1fr;}.bc-arrow{transform:rotate(90deg)}.bc-side .bc-text{font-size:22px}.bubble{max-width:100%}.convo-round{flex-direction:column}}
  /* 手语动作动画 */
  @keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes raise{0%,100%{transform:translateY(5px)}50%{transform:translateY(-5px)}}
  @keyframes tap{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  @keyframes pinch{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
  .anim-wave,.anim-pulse,.anim-raise,.anim-tap,.anim-pinch{transform-box:fill-box;transform-origin:center}
  .anim-wave{animation:wave 1.2s ease-in-out infinite}
  .anim-pulse{animation:pulse 1.4s ease-in-out infinite}
  .anim-raise{animation:raise 1.6s ease-in-out infinite}
  .anim-tap{animation:tap 1.2s ease-in-out infinite}
  .anim-pinch{animation:pinch 1.1s ease-in-out infinite}
  .guide{border:1px solid var(--line);border-radius:12px;background:#fbfdfd;padding:14px 16px;margin-bottom:14px;font-size:13px;line-height:1.9}
  .guide b{color:var(--teal)}
  .demo-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
  /* 3D 演示舞台 */
  .stage3d{position:relative;height:340px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#eef4f3,#f7faf9);overflow:hidden;margin-bottom:16px}
  .stage3d canvas{display:block;position:absolute;left:0;top:0;width:auto;height:auto;max-height:none;max-width:none;background:transparent;border-radius:0;object-fit:fill}
  .stage-tag{position:absolute;left:14px;top:12px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.82);padding:4px 10px;border-radius:8px;z-index:2}
  .stage-fallback{padding:34px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}
  .stage-note{position:absolute;right:14px;bottom:10px;font-size:11px;color:var(--sub);background:rgba(255,255,255,.82);padding:3px 9px;border-radius:8px;z-index:2}
</style>
</head>
<body>
<header>
  <h1>语桥 LinguaBridge <span>方言 · 手语 · 多语言双向翻译 MVP</span></h1>
  <nav id="nav">
    <a href="#/home" data-v="home">首页</a>
    <a href="#/translate" data-v="translate">方言·多语言互译</a>
    <a href="#/sign" data-v="sign">手语演示</a>
    <a href="#/defense" data-v="defense">答辩说明</a>
  </nav>
</header>
<main id="app"></main>
<footer>本演示为课程项目 MVP：手语为 7 个固定示意词（动作示意图演示）；长句翻译在联网时调用在线翻译接口，断网回落离线词库；不代表通用实时翻译系统。</footer>

<script src="assets/three.min.js"></script>
<script src="assets/GLTFLoader.js"></script>
<script src="assets/OrbitControls.js"></script>
<script src="assets/robot-data.js"></script>
<script>
/* ================= 离线演示词库 ================= */
const PHRASES = [
  {zh:"你好", sc:"你好呀", en:"Hello", ja:"こんにちは", ru:"Здравствуйте", scene:"问候"},
  {zh:"谢谢", sc:"多谢了", en:"Thank you", ja:"ありがとうございます", ru:"Спасибо", scene:"感谢"},
  {zh:"医院怎么走", sc:"医院咋个走", en:"How do I get to the hospital?", ja:"病院へはどう行きますか？", ru:"Как пройти в больницу?", scene:"问路·就医"},
  {zh:"多少钱", sc:"好多钱", en:"How much is it?", ja:"いくらですか？", ru:"Сколько это стоит?", scene:"购物"},
  {zh:"早上好", sc:"早上好哦", en:"Good morning", ja:"おはようございます", ru:"Доброе утро", scene:"问候"},
  {zh:"对不起", sc:"对不住", en:"Sorry", ja:"ごめんなさい", ru:"Извините", scene:"道歉"},
  {zh:"再见", sc:"下回摆", en:"Goodbye", ja:"さようなら", ru:"До свидания", scene:"告别"},
  {zh:"我不舒服", sc:"我身上不安逸", en:"I don't feel well", ja:"気分が悪いです", ru:"Мне нездоровится", scene:"就医"},
  {zh:"请问洗手间在哪", sc:"请问厕所在哪点儿", en:"Where is the restroom?", ja:"トイレはどこですか？", ru:"Где туалет?", scene:"问路"},
  {zh:"帮我叫一下医生", sc:"帮我喊下医生", en:"Please call a doctor", ja:"医者を呼んでください", ru:"Пожалуйста, позовите врача", scene:"就医"},
  {zh:"我想去医院看医生", sc:"我想去医院看下医生", en:"I want to go to the hospital to see a doctor", ja:"病院へ行って医者を診てもらいたいです", ru:"Я хочу пойти в больницу к врачу", scene:"就医"},
  {zh:"请问附近有药店吗", sc:"请问附近有药店没得", en:"Is there a pharmacy nearby?", ja:"近くに薬局はありますか？", ru:"Рядом есть аптека?", scene:"就医·问路"},
  {zh:"我有点头疼", sc:"我脑壳有点痛", en:"I have a slight headache", ja:"少し頭が痛いです", ru:"У меня немного болит голова", scene:"就医"},
  {zh:"这个多少钱", sc:"这个好多钱", en:"How much does this cost?", ja:"これはいくらですか？", ru:"Сколько это стоит?", scene:"购物"},
  {zh:"我迷路了", sc:"我遭迷路了", en:"I'm lost", ja:"道に迷いました", ru:"Я заблудился", scene:"问路"},
  {zh:"请慢一点说", sc:"请说慢滴点儿", en:"Please speak slower", ja:"もっとゆっくり話してください", ru:"Пожалуйста, говорите медленнее", scene:"沟通"},
  {zh:"我需要帮助", sc:"我需要搭个手", en:"I need help", ja:"助けが必要です", ru:"Мне нужна помощь", scene:"沟通"},
  {zh:"请问地铁站在哪", sc:"请问地铁站在哪点儿", en:"Where is the subway station?", ja:"地下鉄の駅はどこですか？", ru:"Где станция метро?", scene:"问路"},
  {zh:"今天天气很好", sc:"今天天气巴适得很", en:"The weather is nice today", ja:"今日はいい天気ですね", ru:"Сегодня хорошая погода", scene:"日常"},
  {zh:"我是学生", sc:"我是学生娃", en:"I am a student", ja:"私は学生です", ru:"Я студент", scene:"介绍"},
  {zh:"谢谢你的帮助", sc:"多谢你帮忙", en:"Thank you for your help", ja:"助けてくれてありがとうございます", ru:"Спасибо за помощь", scene:"感谢"},
  {zh:"请帮我翻译这句话", sc:"帮我翻下这句话", en:"Please help me translate this sentence", ja:"この文を訳してください", ru:"Пожалуйста, переведите это предложение", scene:"沟通"}
];

const LANGS = [
  {code:"zh", label:"普通话", tts:"zh-CN"},
  {code:"sc", label:"四川话（方言演示）", tts:"zh-CN"},
  {code:"en", label:"英语", tts:"en-US"},
  {code:"ja", label:"日语", tts:"ja-JP"},
  {code:"ru", label:"俄语", tts:"ru-RU"}
];

/* 手语 7 个固定示意词 + 内置动作示意图（SVG，含身体位置引导线） */
const SKIN="#f0c19a", STROKE="#8a5a3b", GUIDE="#b9c8c4";
function svgWrap(inner, anim){
  const g = anim ? `<g class="${anim}">${inner}</g>` : inner;
  return `<svg width="54" height="54" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
/* —— 可复用手型碎片（局部坐标，掌心为原点） —— */
function fOpenPalm(){return `
  <rect x="-8" y="16" width="16" height="16" rx="6" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="-15" y="-14" width="30" height="32" rx="10" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="-11" y="-34" width="6.5" height="22" rx="3.25" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="-3.5" y="-37" width="6.5" height="25" rx="3.25" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="3" y="-35" width="6.5" height="23" rx="3.25" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="9" y="-31" width="6.5" height="19" rx="3.25" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="13" y="-4" width="14" height="7" rx="3.5" transform="rotate(35 13 0)" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>`;}
function fFist(){return `
  <rect x="-8" y="14" width="16" height="16" rx="6" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="-14" y="-12" width="28" height="26" rx="10" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <path d="M-8 -4 H8 M-8 4 H8" stroke="${STROKE}" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="-13" y="6" width="26" height="7" rx="3.5" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>`;}
function fThumbUp(){return `
  <rect x="-8" y="14" width="16" height="16" rx="6" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="-14" y="-6" width="28" height="20" rx="10" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="-9" y="-26" width="9" height="20" rx="4.5" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <path d="M-6 2 H8" stroke="${STROKE}" stroke-width="2.5" stroke-linecap="round"/>`;}
function fPinch(){return `
  <rect x="-7" y="16" width="14" height="14" rx="6" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <ellipse cx="0" cy="8" rx="14" ry="12" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <circle cx="-4" cy="-6" r="5.5" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <circle cx="4" cy="-6" r="5.5" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <path d="M8 4 q5 4 2 9 M2 10 q4 3 1 7" stroke="${STROKE}" stroke-width="2.5" stroke-linecap="round"/>`;}
function fFlat(){return `
  <rect x="-7" y="16" width="14" height="14" rx="6" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <rect x="-12" y="-26" width="24" height="42" rx="9" fill="${SKIN}" stroke="${STROKE}" stroke-width="3"/>
  <path d="M-6 -18 V8 M0 -20 V10 M6 -18 V8" stroke="${STROKE}" stroke-width="2" stroke-linecap="round" opacity=".6"/>`;}
function gHead(x,y,r){return `<circle cx="${x}" cy="${y}" r="${r||15}" fill="#eef4f3" stroke="${GUIDE}" stroke-width="2" stroke-dasharray="3 3"/>`;}
function gBody(){return `<path d="M26 112 Q60 80 94 112 L94 120 L26 120 Z" fill="#eef4f3" stroke="${GUIDE}" stroke-width="2" stroke-dasharray="3 3"/>`;}

const SIGNS = [
  {no:1, word:"你好", anim:"anim-wave", pos:"胸前（肩前高度）", line:"右手掌心向前，在胸前左右挥动，表示问候“你好”。",
   scene:"见面打招呼、初次介绍自己时使用。",
   tips:"手腕放松，挥动幅度不要太大，眼神看向对方。",
   steps:["右手抬起至胸前高度，五指自然并拢，掌心朝向对方","掌心向左右两侧轻轻挥动 2–3 次","手臂自然放下，完成问候"],
   desc:"右手五指并拢、掌心向前，在胸前轻轻左右挥动，做挥手示意动作。",
   svg:svgWrap(`${gBody()}${gHead(60,34,15)}
     <g transform="translate(62 64) scale(1.05)">${fOpenPalm()}</g>
     <path d="M20 52 H36 M84 52 H100" stroke="${STROKE}" stroke-dasharray="4 4" stroke-width="3" stroke-linecap="round"/>
     <path d="M26 46 L18 52 L26 58 M94 46 L102 52 L94 58" stroke="${STROKE}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`, "anim-wave")},
  {no:2, word:"谢谢", anim:"anim-pulse", pos:"下巴旁", line:"竖起大拇指靠近下巴，向前轻动，表示感谢。",
   scene:"接受帮助、收到东西之后表达谢意。",
   tips:"拇指向上竖起，不要用手指指向对方。",
   steps:["右手握拳，伸出大拇指","拇指尖靠近下巴处","拇指向前轻轻一动，表示感谢"],
   desc:"右手竖起大拇指，拇指尖抵下巴处，向前轻轻一动，表示感谢。",
   svg:svgWrap(`${gHead(74,34,14)}

  {en:"Goodbye", ja:"さようなら", ru:"До свидания", clip:"Wave", match:["再见","Goodbye","goodbye","さようなら","До свидания"]}
];
SIGNS.forEach((s,i)=>Object.assign(s, SIGN_META[i]));

function findSignByText(text){
  if(!text) return -1;
  const t=String(text).trim();
  return SIGNS.findIndex(s=>s.match.some(m=> t===m || t.toLowerCase().includes(m.toLowerCase())));
}

function matchPhrase(text){
  if(!text) return null;
  const t = text.trim();
  return PHRASES.find(p=> p.zh===t || p.sc===t || p.en===t || p.ja===t || p.ru===t) || null;
}

async function mtOnline(text, from, to){
  const f = mtCode(from), t = mtCode(to);
  if(f===t) return {text, src:"同源语言"};
  // 提供方 1：MyMemory（国内网络更易直连，免密钥）
  try{
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${f}|${t}`;
    const r = await fetch(url, {signal:AbortSignal.timeout(3000)});
    const j = await r.json();
    const out = j.responseData && j.responseData.translatedText;
    if(out && !/WARNING|quota|LIMITS/i.test(out)) return {text:out, src:"在线翻译（MyMemory）"};
  }catch(e){}
  // 提供方 2：Google gtx 免密钥接口兜底
  try{
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${f}&tl=${t}&dt=t&q=${encodeURIComponent(text)}`;
    const r = await fetch(url, {signal:AbortSignal.timeout(3000)});
    if(r.ok){
      const j = await r.json();
      const out = (j[0]||[]).map(x=>x[0]).join("");
      if(out && !/WARNING|quota|LIMITS/i.test(out)) return {text:out, src:"在线翻译（Google）"};
    }
  }catch(e){}
  return null;
}

/* 离线规则兜底：仅英语，词表 + 常用句式，仅供演示 */
const DICT_EN = {"我":"I","你":"you","他":"he","她":"she","这":"this","那":"that","想":"want to","去":"go to","是":"am/is/are","有":"have","看":"see","说":"speak","翻译":"translate","请":"please","怎么":"how","走":"get to","迷路":"lost","帮助":"help","慢一点":"slower","今天":"today","很":"very","好":"good","附近":"nearby","多少":"how much","什么":"what","哪里":"where","喜欢":"like","要":"want","医院":"hospital","药店":"pharmacy","地铁站":"subway station","洗手间":"restroom","医生":"doctor","头疼":"headache","学生":"student","天气":"weather","票":"ticket","路":"way","水":"water","饭":"meal","菜":"dish","车":"car","学校":"school","朋友":"friend","老师":"teacher","同学":"classmate","家":"home","手机":"phone","电脑":"computer","衣服":"clothes","老虎":"tiger","猫":"cat","狗":"dog","书":"book","东西":"thing","句子":"sentence","钱":"money","谢谢":"thank you","对不起":"sorry","再见":"goodbye","你好":"hello","早上好":"good morning","苹果":"apple","茶":"tea","咖啡":"coffee","商店":"shop","银行":"bank","饭店":"restaurant","车站":"station","公园":"park","图书馆":"library","宿舍":"dorm","食堂":"canteen"};
function dictPhrase(s){ return s.split(/([，。？！、\s]+)/).map(w=>DICT_EN[w]||w).join(" ").replace(/\s+/g," ").trim(); }
function offlineEn(text){
  let m = text.match(/请问(.+?)在哪/) || text.match(/(.+?)在哪里/); if(m) return `Where is ${dictPhrase(m[1])}?`;
  m = text.match(/我想去(.+)/); if(m) return `I want to go to ${dictPhrase(m[1])}.`;
  m = text.match(/我有点(.+)/); if(m) return `I have a slight ${dictPhrase(m[1])}.`;
  m = text.match(/我是(.+)/); if(m) return `I am ${dictPhrase(m[1])}.`;
  m = text.match(/这是(.+)/); if(m) return `This is ${dictPhrase(m[1])}.`;
  m = text.match(/我喜欢(.+)/); if(m) return `I like ${dictPhrase(m[1])}.`;
  m = text.match(/我要(.+)/); if(m) return `I want ${dictPhrase(m[1])}.`;
  if(/多少钱/.test(text)) return "How much is this?";
  const out = dictPhrase(text);
  return out && out !== text ? out : null;
}

function speakResult(){

function signBridgeBtn(text){
  const si=findSignByText(text);

function wireToSign(text){

/* ================= 视图：手语演示 ================= */
const demo = {timer:null, idx:0, playing:false};
function startAutoDemo(){ stopAutoDemo(); demo.playing=true; demo.idx=0; pickSign(0); demo.timer=setInterval(()=>{demo.idx=(demo.idx+1)%SIGNS.length; pickSign(demo.idx);},2600); syncDemoBtn(); }
function resumeAutoDemo(){ demo.playing=true; demo.timer=setInterval(()=>{demo.idx=(demo.idx+1)%SIGNS.length; pickSign(demo.idx);},2600); syncDemoBtn(); }
function pauseAutoDemo(){ if(demo.timer){clearInterval(demo.timer); demo.timer=null;} demo.playing=false; syncDemoBtn(); }
function stopAutoDemo(){ if(demo.timer){clearInterval(demo.timer); demo.timer=null;} demo.playing=false; syncDemoBtn(); }
function toggleAutoDemo(){ demo.playing ? pauseAutoDemo() : resumeAutoDemo(); }
function syncDemoBtn(){ const b=$("#demoToggle"); if(!b) return; b.textContent=demo.playing?"⏸ 暂停":"▶ 自动演示"; }

/* ================= 3D 演示舞台（离线 three.js + 内置模型） ================= */
const stage = { renderer:null, scene:null, camera:null, mixer:null, controls:null, clips:{}, clock:null, raf:0, ready:false };
function stageFallback(host, msg){ if(host) host.innerHTML=`<div class="stage-fallback">${msg}</div>`; }
function initStage3d(){
  const host=$("#stage3d"); if(!host) return;
  if(!window.THREE || !THREE.GLTFLoader){ stageFallback(host,"三维引擎未加载，已回退到平面手势示意图。"); return; }
  try{
    const w=host.clientWidth||640, h=host.clientHeight||340;
    stage.scene=new THREE.Scene();
    stage.scene.background=new THREE.Color(0xeef4f3);
    stage.camera=new THREE.PerspectiveCamera(42,w/h,.1,100);
    stage.camera.position.set(0,1.3,3.6);
    stage.renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    stage.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    stage.renderer.setSize(w,h);
    stage.renderer.setClearColor(0xeef4f3,1);
    stage.renderer.shadowMap.enabled=true;
    host.appendChild(stage.renderer.domElement);
    stage.scene.add(new THREE.AmbientLight(0xffffff,.78));
    const key=new THREE.DirectionalLight(0xffffff,.95); key.position.set(2,4,3); key.castShadow=true; stage.scene.add(key);
    const fill=new THREE.DirectionalLight(0xdfeefc,.4); fill.position.set(-2,2,-2); stage.scene.add(fill);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20), new THREE.ShadowMaterial({opacity:.12}));
    ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; stage.scene.add(ground);
    stage.controls=new THREE.OrbitControls(stage.camera, stage.renderer.domElement);
    stage.controls.target.set(0,1.0,0); stage.controls.enablePan=false;
    stage.controls.minDistance=2.2; stage.controls.maxDistance=6;
    stage.controls.autoRotate=true; stage.controls.autoRotateSpeed=1.2;
    stage.clock=new THREE.Clock();
    const b64=window.ROBOT_GLB_B64||"";
    const bin=Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
    new THREE.GLTFLoader().parse(bin.buffer, "", g=>{
      const model=g.scene;
      model.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
      // 自适应包围盒：统一缩放到目标高度并落地居中
      let box=new THREE.Box3().setFromObject(model);
      let size=box.getSize(new THREE.Vector3());
      const sc=size.y>0?2.2/size.y:1;
      model.scale.setScalar(sc);
      box=new THREE.Box3().setFromObject(model);
      const c=box.getCenter(new THREE.Vector3());
      model.position.x-=c.x; model.position.z-=c.z; model.position.y-=box.min.y;
      stage.scene.add(model);
      stage.clips={}; g.animations.forEach(c=>stage.clips[c.name]=c);
      stage.mixer=new THREE.AnimationMixer(model);
      stage.ready=true;
      playSignClip(state.signActive||0);
    }, ()=>stageFallback(host,"三维模型加载失败，已回退到平面手势示意图。"));
    loop3d();
    setTimeout(resize3d,300); setTimeout(resize3d,900);
    window.addEventListener("resize", resize3d);
  }catch(e){ stageFallback(host,"当前浏览器不支持 WebGL，已回退到平面手势示意图。"); }
}
function playSignClip(i){
  if(!stage.mixer || !stage.ready) return;
  const s=SIGNS[i]; if(!s) return;
  stage.mixer.stopAllAction();
  const clip=stage.clips[s.clip]||stage.clips.Idle;
  if(clip) stage.mixer.clipAction(clip).reset().play();
}
function loop3d(){
  stage.raf=requestAnimationFrame(loop3d);
  const dt=stage.clock?stage.clock.getDelta():0;
  if(stage.mixer) stage.mixer.update(dt);
  if(stage.controls) stage.controls.update();
  if(stage.renderer&&stage.scene&&stage.camera) stage.renderer.render(stage.scene,stage.camera);
}
function resize3d(){
  const host=$("#stage3d"); if(!host||!stage.renderer) return;
  const w=host.clientWidth,h=host.clientHeight;
  stage.camera.aspect=w/h; stage.camera.updateProjectionMatrix();
  stage.renderer.setSize(w,h);
}
function stopStage3d(){
  if(stage.raf) cancelAnimationFrame(stage.raf);
  stage.raf=0; stage.ready=false; stage.mixer=null;
  if(stage.renderer){ stage.renderer.dispose(); stage.renderer=null; }
}

function renderSign(){

          </div>

  drawSignGrid();

  $("#camUpload").onclick = ()=>$("#fileInput").click();
  $("#camStop").onclick = stopCam;
  $("#fileInput").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const img = $("#camImg");
    img.src = URL.createObjectURL(f); img.hidden = false;
    $("#video").hidden = true; $("#canvas").hidden = true;
    showSignResult("已上传图片，请在右侧候选词中确认对应手语词。");
  };
  document.onkeydown = e=>{
    if(state.view!=="sign") return;
    if(e.key>="1" && e.key<="7") pickSign(Number(e.key)-1);

}

function drawSignGrid(){
  const g = $("#signGrid");
  g.innerHTML = SIGNS.map((s,i)=>`
    <div class="sign-card ${state.signActive===i?"active":""}" data-i="${i}">
      ${s.svg}
      <div><div><span class="no">${s.no}</span><b>${s.word}</b></div><div class="muted" style="font-size:11px;margin-top:2px">${s.en}</div></div>
    </div>`).join("");
  g.querySelectorAll(".sign-card").forEach(el=>{ el.onclick = ()=>pickSign(Number(el.dataset.i)); });
}

function pickSign(i){
  state.signActive = i; demo.idx = i;
  const s = SIGNS[i];
  drawSignGrid();
  playSignClip(i);
  const st = $("#demoStatus"); if(st) st.textContent = `第 ${i+1} / ${SIGNS.length} 个`;
  $("#signResult").innerHTML = `
    <div class="result">

    </div>`;
}

function showSignResult(msg){
  $("#signResult").innerHTML = `<div class="result"><div class="muted">${msg}</div></div>`;
}

async function startCam(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    state.signStream = stream;
    const v = $("#video");
    v.srcObject = stream; v.hidden = false;
    $("#camImg").hidden = true; $("#canvas").hidden = true;
    $("#camStart").disabled = true; $("#camShot").disabled = false; $("#camStop").disabled = false;
  }catch(err){
    showSignResult("摄像头无法开启（权限拒绝 / 设备占用 / 浏览器限制）。请使用「上传图片」或直接点词卡、按键盘 1–7 继续演示。");
    $("#camShot").disabled = true;
  }
}

function captureShot(){
  const v = $("#video"), c = $("#canvas");
  c.width = v.videoWidth || 640; c.height = v.videoHeight || 480;
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  c.hidden = false; v.hidden = true;
  showSignResult("已拍摄画面，请在右侧 7 个候选词中确认识别结果（点击词卡或按键盘 1–7）。");
}

function stopCam(){
  if(state.signStream){ state.signStream.getTracks().forEach(t=>t.stop()); state.signStream=null; }
  $("#video").hidden = true; $("#canvas").hidden = true;
  $("#camStart").disabled = false; $("#camShot").disabled = true; $("#camStop").disabled = true;
}

/* ================= 视图：答辩说明 ================= */
function renderDefense(){
  app.innerHTML = `

      <div class="step"><div class="n">1</div><div><strong>开场（20 秒）：</strong>介绍项目名 LinguaBridge，目标是帮方言使用者、外语沟通者和听障人群做跨语言沟通；说明今天演示的是 MVP 原型。</div></div>

      </div>
